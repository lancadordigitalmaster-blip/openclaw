name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for merge conflicts
        run: |
          if grep -rn '<<<<<<< \|======= \|>>>>>>> ' --include='*.js' --include='*.ts' --include='*.md' --include='*.json' .; then
            echo "::error::Merge conflict markers found"
            exit 1
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -rn 'wolf2026\|sk-ant-api' --include='*.js' --include='*.ts' .; then
            echo "::error::Possible hardcoded secrets found"
            exit 1
          fi
